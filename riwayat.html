<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Riwayat — Demo Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
<div class="flex h-screen">
  <aside class="w-56 bg-slate-900 text-white flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-slate-800">
      <h1 class="text-xl font-bold">💰 Kasir POS</h1>
      <p class="text-xs text-slate-400 mt-1">Demo v1.2.1</p>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <a href="kasir.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>🛒</span> Kasir</a>
      <a href="produk.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📦</span> Produk</a>
      <a href="kategori.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📁</span> Kategori</a>
      <a href="riwayat.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-600 text-white"><span>📋</span> Riwayat</a>
      <a href="laporan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📊</span> Laporan</a>
      <a href="pengaturan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>⚙️</span> Pengaturan</a>
    </nav>
    <div class="p-4 text-xs text-slate-500 border-t border-slate-800">
      <a href="index.html" class="hover:text-slate-300">← Home</a>
    </div>
  </aside>

  <main class="flex-1 overflow-auto p-6 space-y-6">
    <h2 class="text-2xl font-bold">📋 Riwayat Transaksi</h2>

    <div class="grid grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500">
        <p class="text-sm text-gray-500">Transaksi Hari Ini</p>
        <p class="text-2xl font-bold text-blue-600 mt-1">24</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-500">
        <p class="text-sm text-gray-500">Pendapatan Hari Ini</p>
        <p class="text-2xl font-bold text-green-600 mt-1">Rp 1.250.000</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-purple-500">
        <p class="text-sm text-gray-500">Item Terjual</p>
        <p class="text-2xl font-bold text-purple-600 mt-1">48</p>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-100">
          <tr>
            <th class="text-left p-3">Invoice</th>
            <th class="text-left p-3">Waktu</th>
            <th class="text-center p-3">Item</th>
            <th class="text-left p-3">Metode</th>
            <th class="text-right p-3">Total</th>
            <th class="text-center p-3">Aksi</th>
          </tr>
        </thead>
        <tbody id="trxList"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const TRX = [
    { invoice: "INV-20260922-0024", time: "22 Sep, 14:35", items: 3, method: "CASH", total: 52000 },
    { invoice: "INV-20260922-0023", time: "22 Sep, 14:20", items: 5, method: "QRIS", total: 85000 },
    { invoice: "INV-20260922-0022", time: "22 Sep, 14:05", items: 2, method: "DEBIT", total: 35000 },
    { invoice: "INV-20260922-0021", time: "22 Sep, 13:50", items: 8, method: "CASH", total: 145000, refund: true },
    { invoice: "INV-20260922-0020", time: "22 Sep, 13:30", items: 4, method: "TRANSFER", total: 92000 },
    { invoice: "INV-20260922-0019", time: "22 Sep, 13:15", items: 1, method: "CASH", total: 18000 }
  ];

  const methodColors = {
    CASH: "bg-green-100 text-green-700",
    QRIS: "bg-purple-100 text-purple-700",
    DEBIT: "bg-blue-100 text-blue-700",
    TRANSFER: "bg-orange-100 text-orange-700"
  };

  document.getElementById("trxList").innerHTML = TRX.map(t => `
    <tr class="border-t hover:bg-gray-50">
      <td class="p-3 font-mono text-xs">
        <div class="flex items-center gap-1.5">
          <span>${t.invoice}</span>
          ${t.refund ? `<span class="px-2 py-0.5 rounded text-xs bg-red-100 text-red-700 font-medium">🔄 Diretur</span>` : ""}
        </div>
      </td>
      <td class="p-3 text-xs text-gray-600">${t.time}</td>
      <td class="p-3 text-center"><span class="px-2 py-0.5 bg-gray-100 rounded text-xs">${t.items}</span></td>
      <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-medium ${methodColors[t.method]}">${t.method}</span></td>
      <td class="p-3 text-right font-bold text-blue-600">Rp ${t.total.toLocaleString("id-ID")}</td>
      <td class="p-3 text-center">
        <button onclick="alert('Demo: detail transaksi')" class="text-blue-600 hover:underline text-xs">Detail</button>
      </td>
    </tr>
  `).join("");
</script>
</body>
</html>
