<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Produk — Demo Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
<div class="flex h-screen">
  <aside class="w-56 bg-slate-900 text-white flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-slate-800">
      <h1 class="text-xl font-bold">💰 Kasir POS</h1>
      <p class="text-xs text-slate-400 mt-1">Demo v1.2.1</p>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <a href="kasir.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>🛒</span> Kasir</a>
      <a href="produk.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-600 text-white"><span>📦</span> Produk</a>
      <a href="kategori.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📁</span> Kategori</a>
      <a href="riwayat.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📋</span> Riwayat</a>
      <a href="laporan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📊</span> Laporan</a>
      <a href="pengaturan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>⚙️</span> Pengaturan</a>
    </nav>
    <div class="p-4 text-xs text-slate-500 border-t border-slate-800">
      <a href="index.html" class="hover:text-slate-300">← Home</a>
    </div>
  </aside>

  <main class="flex-1 overflow-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">📦 Manajemen Produk</h2>
      <button onclick="alert('Demo: buka form tambah produk')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">
        + Tambah Produk
      </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-100">
          <tr>
            <th class="text-left p-3">Nama</th>
            <th class="text-left p-3">Kategori</th>
            <th class="text-center p-3">Tipe</th>
            <th class="text-right p-3">Harga</th>
            <th class="text-right p-3">Stok</th>
            <th class="text-center p-3">Aksi</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const PRODUCTS = [
    { id:"1", name:"Kopi Susu", price:18000, stock:50, category:"Minuman", emoji:"☕" },
    { id:"2", name:"Teh Manis", price:8000, stock:100, category:"Minuman", emoji:"☕" },
    { id:"3", name:"Nasi Goreng", price:25000, stock:30, category:"Makanan", emoji:"🍜" },
    { id:"4", name:"Apel Fuji", price:35000, stock:8.5, category:"Buah", emoji:"🍎", weighted:true, unit:"kg" },
    { id:"5", name:"Indomie Goreng", price:3500, stock:240, category:"Sembako", emoji:"🌾", tiers:3 }
  ];

  document.getElementById("productTable").innerHTML = PRODUCTS.map(p => `
    <tr class="border-t hover:bg-gray-50">
      <td class="p-3 font-medium">${p.name}</td>
      <td class="p-3"><span class="text-gray-600">${p.emoji} ${p.category}</span></td>
      <td class="p-3 text-center">
        ${p.weighted ? `<span class="px-2 py-0.5 bg-orange-100 text-orange-700 rounded text-xs">⚖️ ${p.unit}</span>` : ""}
        ${p.tiers ? `<span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs">💰 ${p.tiers} tier</span>` : ""}
        ${!p.weighted && !p.tiers ? `<span class="px-2 py-0.5 bg-gray-100 text-gray-600 rounded text-xs">📦 pcs</span>` : ""}
      </td>
      <td class="p-3 text-right">Rp ${p.price.toLocaleString("id-ID")}${p.weighted ? `/${p.unit}` : ""}</td>
      <td class="p-3 text-right">
        <span class="px-2 py-1 rounded text-xs font-medium ${p.stock > 10 ? "bg-green-100 text-green-700" : p.stock > 0 ? "bg-yellow-100 text-yellow-700" : "bg-red-100 text-red-700"}">
          ${p.weighted ? p.stock + " " + p.unit : Math.floor(p.stock)}
        </span>
      </td>
      <td class="p-3 text-center space-x-2">
        <button onclick="alert('Demo: restock')" class="text-green-600 hover:underline text-xs">+ Stok</button>
        <button onclick="alert('Demo: edit')" class="text-blue-600 hover:underline text-xs">Edit</button>
        <button onclick="alert('Demo: hapus')" class="text-red-600 hover:underline text-xs">Hapus</button>
      </td>
    </tr>
  `).join("");
</script>
</body>
</html>
