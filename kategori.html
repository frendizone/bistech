<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kategori — Demo Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
<div class="flex h-screen">
  <aside class="w-56 bg-slate-900 text-white flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-slate-800">
      <h1 class="text-xl font-bold">💰 Kasir POS</h1>
      <p class="text-xs text-slate-400 mt-1">Demo v1.2.1</p>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <a href="kasir.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>🛒</span> Kasir</a>
      <a href="produk.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📦</span> Produk</a>
      <a href="kategori.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-600 text-white"><span>📁</span> Kategori</a>
      <a href="riwayat.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📋</span> Riwayat</a>
      <a href="laporan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>📊</span> Laporan</a>
      <a href="pengaturan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800"><span>⚙️</span> Pengaturan</a>
    </nav>
    <div class="p-4 text-xs text-slate-500 border-t border-slate-800">
      <a href="index.html" class="hover:text-slate-300">← Home</a>
    </div>
  </aside>

  <main class="flex-1 overflow-auto p-6 max-w-3xl">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">📁 Manajemen Kategori</h2>
      <button onclick="alert('Demo: form tambah kategori')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">
        + Tambah Kategori
      </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden divide-y" id="catList"></div>
  </main>
</div>

<script>
  const CATS = [
    { name: "Minuman", emoji: "☕", color: "bg-blue-500", count: 3 },
    { name: "Makanan", emoji: "🍜", color: "bg-orange-500", count: 2 },
    { name: "Snack", emoji: "🍿", color: "bg-purple-500", count: 0 },
    { name: "Buah", emoji: "🍎", color: "bg-red-500", count: 1 },
    { name: "Sayur", emoji: "🥬", color: "bg-green-500", count: 0 },
    { name: "Sembako", emoji: "🌾", color: "bg-yellow-500", count: 2 },
    { name: "Lainnya", emoji: "📦", color: "bg-gray-500", count: 0 }
  ];

  document.getElementById("catList").innerHTML = CATS.map((c, i) => `
    <div class="p-4 flex items-center gap-3 hover:bg-gray-50">
      <div class="flex flex-col gap-0.5">
        <button class="w-5 h-5 text-xs text-gray-400 hover:text-gray-700">▲</button>
        <button class="w-5 h-5 text-xs text-gray-400 hover:text-gray-700">▼</button>
      </div>
      <div class="w-1 h-10 rounded ${c.color}"></div>
      <span class="text-2xl">${c.emoji}</span>
      <div class="flex-1">
        <p class="font-semibold">${c.name}</p>
        <p class="text-xs text-gray-500">${c.count} produk</p>
      </div>
      <div class="flex gap-2">
        <button onclick="alert('Demo: edit ${c.name}')" class="text-blue-600 hover:underline text-xs font-semibold">Edit</button>
        <button onclick="alert('Demo: hapus ${c.name}')" class="text-xs font-semibold ${c.count > 0 ? 'text-gray-300 cursor-not-allowed' : 'text-red-600 hover:underline'}">Hapus</button>
      </div>
    </div>
  `).join("");
</script>
</body>
</html>
